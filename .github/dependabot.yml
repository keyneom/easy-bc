version: 2
updates:
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    groups:
      web-dependencies:
        patterns: ["*"]

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      rust-dependencies:
        patterns: ["*"]

  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: weekly
    # sync-kit RC upgrades are coordinated manually with the web package so
    # cross-platform protocol parity remains a release gate. Dependabot also
    # cannot query this GitHub Packages artifact without separate package
    # credentials, even though Actions can resolve the pinned version.
    ignore:
      - dependency-name: com.keyneom:sync-kit-android
    groups:
      android-dependencies:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
